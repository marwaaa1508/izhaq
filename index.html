<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izhaq Weds Naeema</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🎵 YouTube Player (hidden) -->
<div id="player"></div>

<!-- 🌸 HERO / CANVA LANDING -->
<section class="hero">

  <div class="glass-card">

    <h1 class="bismillah">Bismillah</h1>

    <h2 class="names">Izhaq & Naeema</h2>

    <p class="subtitle">We joyfully invite you to our wedding</p>

    <div class="save-card" id="saveDateBtn">
      <p>Save the Date</p>
    </div>

  </div>

</section>

<!-- 💌 INVITATION SECTION -->
<section class="invitation" id="invitation">

  <h2>Wedding Invitation</h2>

  <p class="quote">
    With hearts filled with gratitude and duas,<br>
    we invite you to celebrate our special day.
  </p>

  <div class="grid">

    <div class="box">
      <h3>📅 Date</h3>
      <p>Insert Date Here</p>
    </div>

    <div class="box">
      <h3>📍 Venue</h3>
      <p>Insert Venue Here</p>
    </div>

    <div class="box">
      <h3>🕰 Time</h3>
      <p>Insert Time Here</p>
    </div>

  </div>

  <a class="btn" href="https://wa.me/0000000000" target="_blank">
    RSVP on WhatsApp
  </a>

</section>

<!-- 🎬 YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>

</body>
</html>
